<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos em HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>
    <video controls 
        width="500">
        <source src="midia/meu-video.mp4" type="video/mp4">
        <source src="midia/meu-video.ogg" type="video/ogg">
    </video>
   <h1>Vídeo no YouTube</h1>

    <a href="https://www.youtube.com/watch?v=2zp2F7ybzhQ" 
    target="_blank" 
    rel="noopener noreferrer" 
    style="display: inline-block; padding: 12px 20px; background-color: #FF0000; color: #FFFFFF; text-decoration: none; border-radius: 5px; font-weight: bold; font-family: sans-serif;">
    Assistir ao vídeo no YouTube ↗
    </a>
</body>
</html>
